<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>To My Love ❤️</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
</head>
<body>

<div id="app">

    <!-- START SCREEN -->
    <div id="start-screen">
        <h1 class="start-title">A Universe For You</h1>
        <p class="start-subtitle">Somewhere in infinity, I found you...</p>

        <div class="kittens">
            <div class="kitten">🐈</div>
            <div class="kitten-heart">❤️</div>
            <div class="kitten">🐈‍⬛</div>
        </div>

        <button id="start-btn">Click here, my love ❤️</button>
    </div>

    <!-- JOURNEY TEXT -->
    <div id="journey-text">Taking you to my universe...</div>

    <!-- GALAXY UI -->
    <div id="galaxy-ui">
        <h2 id="galaxy-title">You Are My Universe ✨</h2>
        <div id="hint">Touch the planets... explore our universe</div>
    </div>

    <!-- MODAL -->
    <div id="modal">
        <div class="modal-card">
            <button id="modal-close">×</button>
            <img id="modal-image" src="" alt="Our memory">
            <h2 id="modal-title"></h2>
            <p id="modal-text"></p>
        </div>
    </div>

    <!-- МУЗЫКА (Назови свой файл music.mp3 и положи в папку с проектом) -->
    <audio id="bg-music" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

</div>

<script type="module" src="script.js"></script>
</body>
</html>
